name: Windows installer

on:
  push:
    branches:
      - "feature/nsis-installer"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.404

      - name: Install NSIS
        run: choco install nsis --yes --no-progress

      - name: Restore
        run: dotnet restore DeskNotes.slnx

      - name: Build Release
        run: dotnet build DeskNotes.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test DeskNotes.slnx --configuration Release --no-build --verbosity normal

      - name: Publish single-file application (framework-dependent)
        shell: pwsh
        run: ./packaging/publish.ps1

      - name: Build NSIS installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/installer | Out-Null
          & "$env:ProgramFiles(x86)\NSIS\makensis.exe" /DAPP_VERSION=0.1.0-alpha /DAPP_VERSION_NUM=0.1.0.0 /DPUBLISH_DIR="$PWD\artifacts\publish" /DOUTPUT_DIR="$PWD\artifacts\installer" packaging/nsis/DeskNotes.nsi
          if ($LASTEXITCODE -ne 0) { throw "NSIS ha fallado con exit code $LASTEXITCODE." }

      - name: Upload installer
        uses: actions/upload-artifact@v6
        with:
          name: desknotes-setup-win-x64
          path: artifacts/installer/desknotes-setupe.exe
          if-no-files-found: error
          retention-days: 14
